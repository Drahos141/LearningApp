# One container serves the frontend and the API: http://localhost:4000
#   docker compose up --build
services:
  app:
    build: .
    image: learningapp
    ports:
      - "4000:4000"
    restart: unless-stopped
    # Content is served from memory by default. To use MongoDB instead, run one and set:
    # environment:
    #   - MONGO_URI=mongodb://host.docker.internal:27017/learningapp
    #   - SEED_DB=true   # copy the bundled content into MongoDB on startup
